services:
  mongo:
    image: mongo:7
    container_name: csa-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: csa-api
    ports:
      - "8080:8080"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: counter_scam_agency
      CORS_ORIGIN: "*"
      ADDR: ":8080"
    depends_on:
      - mongo

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: csa-web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mongo-data:
